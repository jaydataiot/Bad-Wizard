<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="Contact Bad Wizard Games through the official message service.">
  <title>Contact — Bad Wizard Games</title>
  <link rel="icon" href="assets/logo_switched.png">
  <style>
    :root{--bg:#0f1117;--panel:#151925;--panel-2:#10131b;--text:#e7e8ea;--muted:#a7adbb;--brand:#ffb84d;--brand-2:#8e6bff;--edge:rgba(255,255,255,.09);--radius:18px;--shadow:0 .75rem 2.2rem rgba(0,0,0,.38)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(850px 500px at 100% 0,rgba(142,107,255,.18),transparent 55%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}.wrap{width:min(780px,calc(100% - 28px));margin:auto;padding:36px 0 56px}.brand{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:900;letter-spacing:.04em}.brand img{width:44px;height:44px;object-fit:contain}.panel{margin-top:28px;padding:clamp(22px,5vw,42px);border:1px solid var(--edge);border-radius:26px;background:radial-gradient(120% 120% at 10% 0,rgba(142,107,255,.15),transparent 42%),var(--panel);box-shadow:var(--shadow)}.eyebrow{color:#cfc1ff;font-size:.76rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.3rem,7vw,4.5rem);line-height:.95;margin:.45rem 0 1rem}.lead{color:var(--muted);margin:0 0 1.5rem}.form{display:grid;gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;font-weight:750}.input,select,textarea{width:100%;border:1px solid var(--edge);border-radius:12px;background:var(--panel-2);color:var(--text);padding:.85rem 1rem;font:inherit;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(142,107,255,.25)}textarea{min-height:150px;resize:vertical}.check{display:flex;align-items:center;gap:.6rem;font-weight:600}.btn,.btn-outline{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.75rem 1.1rem;border:1px solid transparent;font:inherit;font-weight:850;cursor:pointer;text-decoration:none}.btn{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#101116}.btn:disabled{opacity:.55;cursor:wait}.btn-outline{border-color:var(--edge);color:var(--text);background:var(--panel)}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status{min-height:1.5rem;margin:0;color:var(--muted)}.status.success{color:#9ce0b8}.status.error{color:#ff9c9c}.route{padding:12px 14px;border:1px solid rgba(142,107,255,.3);border-radius:12px;background:rgba(142,107,255,.08);color:#d9d0ff;font-size:.9rem}@media(max-width:640px){.two{grid-template-columns:1fr}.wrap{padding-top:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><img src="assets/logo_switched.png" alt="Bad Wizard Games logo"><span>Bad Wizard Games</span></div>
    <section class="panel">
      <div class="eyebrow">Official contact portal</div>
      <h1>Send a message.</h1>
      <p class="lead">Your message will be delivered through the Bad Wizard contact service to the selected studio address.</p>
      <p class="route" id="routeNotice" aria-live="polite"></p>
      <form class="form" id="contactRouter" enctype="multipart/form-data">
        <div class="two"><label>Name <input class="input" name="name" autocomplete="name" required></label><label>Email <input class="input" name="email" type="email" autocomplete="email" required></label></div>
        <div class="two"><label>Send To <select name="recipient" id="recipient" required><option value="contact@badwizard.games">General Contact — contact@badwizard.games</option><option value="hello@badwizard.games">Hello — hello@badwizard.games</option><option value="newsletter@badwizard.games">Newsletter — newsletter@badwizard.games</option><option value="sales@badwizard.games">Sales — sales@badwizard.games</option><option value="support@badwizard.games">Support — support@badwizard.games</option><option value="founder@badwizard.games">Founder — founder@badwizard.games</option></select></label><label>Topic <select name="topic" id="topic" required><option value="General Inquiry">General Inquiry</option><option value="Collaboration / Pitch">Collaboration / Pitch</option><option value="Press / Creator">Press / Creator</option><option value="Retail / Wholesale">Retail / Wholesale</option><option value="Support">Support</option><option value="Other">Other</option></select></label></div>
        <label>Message <textarea name="message" id="message" required placeholder="Tell us how we can help…"></textarea></label>
        <label>Attachment (optional) <input class="input" name="attachment" type="file"></label>
        <label class="check"><input name="subscribe" type="checkbox" value="true"> Subscribe to Bad Wizard Games updates</label>
        <div class="actions"><button class="btn" id="sendButton" type="submit">Send Message</button></div>
        <p class="status" id="formStatus" role="status"></p>
      </form>
    </section>
  </main>
  <script>
    (()=>{
      const endpoint='https://wizard-chat-assistant.replit.app/api/contact';
      const allowedRecipients=new Set(['contact@badwizard.games','hello@badwizard.games','newsletter@badwizard.games','sales@badwizard.games','support@badwizard.games','founder@badwizard.games']);
      const allowedTopics=new Set(['General Inquiry','Collaboration / Pitch','Press / Creator','Retail / Wholesale','Support','Other']);
      const params=new URLSearchParams(location.search),form=document.getElementById('contactRouter'),recipient=document.getElementById('recipient'),topic=document.getElementById('topic'),message=document.getElementById('message'),status=document.getElementById('formStatus'),button=document.getElementById('sendButton'),notice=document.getElementById('routeNotice');
      const requestedRecipient=params.get('recipient'),requestedTopic=params.get('topic');
      if(allowedRecipients.has(requestedRecipient))recipient.value=requestedRecipient;
      if(allowedTopics.has(requestedTopic))topic.value=requestedTopic;
      if(params.get('message'))message.value=params.get('message');
      notice.textContent=`Routed to ${recipient.value} · ${topic.value}`;
      recipient.addEventListener('change',()=>notice.textContent=`Routed to ${recipient.value} · ${topic.value}`);
      topic.addEventListener('change',()=>notice.textContent=`Routed to ${recipient.value} · ${topic.value}`);
      form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.className='status';status.textContent='Sending your message…';const data=new FormData(form);if(!data.has('subscribe'))data.set('subscribe','false');try{const response=await fetch(endpoint,{method:'POST',body:data,credentials:'include'}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'The message could not be sent.');form.reset();recipient.value=allowedRecipients.has(requestedRecipient)?requestedRecipient:'contact@badwizard.games';topic.value=allowedTopics.has(requestedTopic)?requestedTopic:'General Inquiry';notice.textContent=`Routed to ${recipient.value} · ${topic.value}`;status.className='status success';status.textContent='Your message was sent successfully.'}catch(error){status.className='status error';status.textContent=error.message||'The contact service is temporarily unavailable.'}finally{button.disabled=false}});
    })();
  </script>
</body>
</html>
